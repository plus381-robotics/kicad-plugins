name: Publish KiCad PCM repository

# Builds the plugin packages and publishes them on GitHub Pages, where KiCad's
# Plugin and Content Manager picks them up. Bump __version__ to ship an update.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: |
          pip install pyflakes jsonschema
          python3 -m pyflakes plus381-tools pcm
          python3 -c "import json; json.load(open('plus381-tools/plugin.json'))"

      - uses: actions/configure-pages@v5

      - name: Build PCM repository
        run: python3 pcm/build.py --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
